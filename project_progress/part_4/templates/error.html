{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 5rem; margin-bottom: 1rem;">😞</div>
    <h1 style="font-size: 2rem; color: #2d3748; margin-bottom: 1rem;">Oops! Something went wrong</h1>
    <p style="font-size: 1.2rem; color: #718096; margin-bottom: 2rem;">{{ message }}</p>
    
    <a href="/" style="display: inline-block; padding: 12px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; transition: background 0.3s;">
        Go Back Home
    </a>
</div>
{% endblock %}
